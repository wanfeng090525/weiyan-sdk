name: 构建微验 WY SDK arm64-v8a .so

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-weiyan:
    name: 构建 arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: 构建 .so (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}
          cd "${GITHUB_WORKSPACE}/android"
          rm -rf libs obj   # 清理缓存，防止增量构建问题
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          find libs -name "*.so" -ls

      - name: 校验产物
        run: |
          SO=$(find "${GITHUB_WORKSPACE}/android/libs" -name "*.so" | head -1)
          test -n "$SO" && test -s "$SO" || { echo "!!! .so 构建失败或为空 !!!"; exit 1; }
          echo "=== 产物 ==="
          ls -lh "$SO"
          file "$SO"
          cp "$SO" "${GITHUB_WORKSPACE}/libwyverify-arm64-v8a.so"
          ls -lh "${GITHUB_WORKSPACE}/libwyverify-arm64-v8a.so"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wyverify-arm64-v8a
          path: libwyverify-arm64-v8a.so

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "微验 WY SDK ${GITHUB_REF_NAME}" \
            --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" \
            libwyverify-arm64-v8a.so \
            --clobber
